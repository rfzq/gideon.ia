<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gideon</title>
  <style>
    body { font-family: Segoe UI, sans-serif; background: #141418; color: #f2f2f7; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 12px 16px; background: #1e1e24; border-bottom: 1px solid #2c2c36; font-weight: 600; }
    #chat { flex: 1; overflow-y: auto; padding: 16px; white-space: pre-wrap; line-height: 1.45; }
    .msg { margin-bottom: 14px; }
    .autor { font-weight: 700; color: #7aa2ff; }
    form { display: flex; gap: 8px; padding: 12px; background: #141418; border-top: 1px solid #26262e; }
    input { flex: 1; padding: 10px 12px; border-radius: 6px; border: none; background: #26262e; color: #fff; font-size: 15px; }
    button { padding: 10px 18px; border-radius: 6px; border: none; background: #3a6ff8; color: #fff; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>Gideon — {{ modelo }}</header>
  <div id="chat"></div>
  <form id="form">
    <input id="entrada" type="text" placeholder="Escreve a tua mensagem..." autocomplete="off" autofocus />
    <button id="btn" type="submit">Enviar</button>
  </form>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const entrada = document.getElementById("entrada");
    const btn = document.getElementById("btn");

    function adicionarBloco(autor, texto = "") {
      const div = document.createElement("div");
      div.className = "msg";
      const spanAutor = document.createElement("span");
      spanAutor.className = "autor";
      spanAutor.textContent = autor + ": ";
      const spanTexto = document.createElement("span");
      spanTexto.textContent = texto;
      div.appendChild(spanAutor);
      div.appendChild(spanTexto);
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return spanTexto;
    }

    adicionarBloco("Gideon", "Pronto. O que vamos mandar ver?");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const texto = entrada.value.trim();
      if (!texto) return;

      entrada.value = "";
      entrada.disabled = true;
      btn.disabled = true;

      adicionarBloco("Tu", texto);
      const alvo = adicionarBloco("Gideon", "");

      const resp = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mensagem: texto })
      });

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        alvo.textContent += decoder.decode(value, { stream: true });
        chat.scrollTop = chat.scrollHeight;
      }

      entrada.disabled = false;
      btn.disabled = false;
      entrada.focus();
    });
  </script>
</body>
</html>
