<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GIDEON.IA // Painel</title>
    <style>
        :root {
            --bg-main: #090812;
            --bg-panel: #110f21;
            --bg-card: #17142b;
            --bg-input: #141126;
            --border-subtle: rgba(168, 139, 250, 0.16);
            --border-strong: rgba(192, 132, 252, 0.35);
            --text-primary: #f5f3ff;
            --text-secondary: #a59ec9;
            --text-muted: #6f6894;
            --accent: #a855f7;
            --accent-2: #6366f1;
            --accent-glow: rgba(168, 85, 247, 0.35);
            --success: #34d399;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            background: radial-gradient(circle at 60% 28%, rgba(124, 58, 237, 0.14), transparent 42%),
                        radial-gradient(circle at 20% 80%, rgba(79, 70, 229, 0.10), transparent 45%),
                        var(--bg-main);
            color: var(--text-primary);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        .app-shell {
            display: flex;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* Sidebar */
        .sidebar {
            width: 268px;
            min-width: 268px;
            background: rgba(15, 13, 30, 0.92);
            border-right: 1px solid var(--border-subtle);
            backdrop-filter: blur(14px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 18px 16px;
            transition: transform 0.25s ease, width 0.25s ease, min-width 0.25s ease, padding 0.25s ease;
            z-index: 30;
        }

        .sidebar.collapsed {
            width: 0;
            min-width: 0;
            padding: 18px 0;
            overflow: hidden;
            border-right-color: transparent;
        }

        .sidebar-top {
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .brand-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 10px 8px 6px;
            gap: 10px;
        }

        .dots-indicator {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
        }

        .dots-indicator span {
            width: 6px;
            height: 6px;
            border-radius: 999px;
            background: rgba(196, 181, 253, 0.45);
        }

        .dots-indicator span:nth-child(2) {
            background: #c084fc;
            box-shadow: 0 0 8px #a855f7;
        }

        .brand-title {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.22em;
            color: var(--text-primary);
        }

        .brand-subtitle {
            font-size: 10px;
            letter-spacing: 0.24em;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-top: -4px;
        }

        .section-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.16em;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 10px;
            padding-left: 4px;
        }

        .quick-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .cmd-btn {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--border-subtle);
            background: rgba(24, 20, 46, 0.78);
            color: var(--text-primary);
            font-size: 12.5px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.18s ease;
            text-align: left;
        }

        .cmd-btn:hover {
            border-color: var(--border-strong);
            background: rgba(38, 30, 74, 0.9);
            transform: translateY(-1px);
        }

        .cmd-btn svg {
            width: 15px;
            height: 15px;
            color: #c084fc;
            flex-shrink: 0;
        }

        .status-card {
            background: rgba(20, 17, 38, 0.85);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .status-line {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
        }

        .status-meta {
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 1.45;
        }

        .controls-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 4px;
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12.5px;
            color: var(--text-secondary);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 38px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: #2a2547;
            transition: 0.2s;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 2px;
            bottom: 2px;
            background-color: #d8d4f0;
            transition: 0.2s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background: linear-gradient(90deg, var(--accent-2), var(--accent));
        }

        input:checked + .slider:before {
            transform: translateX(18px);
            background-color: #ffffff;
        }

        /* Main area */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            min-width: 0;
            position: relative;
        }

        .topbar-toggle {
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 40;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid var(--border-subtle);
            background: rgba(20, 17, 38, 0.85);
            color: var(--text-primary);
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .desktop-toggle {
            position: fixed;
            top: 14px;
            left: 282px;
            z-index: 25;
            width: 32px;
            height: 32px;
            border-radius: 9px;
            border: 1px solid var(--border-subtle);
            background: rgba(20, 17, 38, 0.72);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: left 0.25s ease, color 0.2s ease, border-color 0.2s ease;
        }

        .desktop-toggle:hover {
            color: var(--text-primary);
            border-color: var(--border-strong);
        }

        .sidebar.collapsed + .main-area .desktop-toggle {
            left: 14px;
        }

        .chat-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 28px 24px 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            scroll-behavior: smooth;
        }

        .chat-container {
            width: 100%;
            max-width: 820px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* Core orb header */
        .core-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin: 12px auto 14px;
            gap: 14px;
        }

        .gideon-orb {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            position: relative;
            background:
                radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.92), rgba(216, 180, 254, 0.65) 26%, rgba(124, 58, 237, 0.75) 58%, rgba(30, 27, 75, 0.95) 85%);
            box-shadow:
                0 0 28px rgba(168, 85, 247, 0.45),
                0 0 65px rgba(99, 102, 241, 0.22),
                inset 0 0 18px rgba(255, 255, 255, 0.35);
            animation: floatOrb 4.5s ease-in-out infinite;
        }

        .gideon-orb.thinking {
            animation: pulseOrb 1.1s ease-in-out infinite;
            box-shadow:
                0 0 38px rgba(192, 132, 252, 0.78),
                0 0 85px rgba(124, 58, 237, 0.45),
                inset 0 0 22px rgba(255, 255, 255, 0.55);
        }

        @keyframes floatOrb {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-4px) scale(1.02); }
        }

        @keyframes pulseOrb {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.07); }
        }

        .core-status-text {
            font-size: 11px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .core-status-text .online-word {
            color: #34d399;
            font-weight: 600;
        }

        /* Messages */
        .msg-row {
            display: flex;
            width: 100%;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-row.user {
            justify-content: flex-end;
        }

        .msg-row.assistant {
            justify-content: flex-start;
        }

        .bubble-user {
            max-width: 72%;
            background: rgba(34, 29, 66, 0.9);
            border: 1px solid rgba(168, 139, 250, 0.24);
            color: var(--text-primary);
            padding: 12px 16px;
            border-radius: 16px 16px 4px 16px;
            font-size: 14px;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .assistant-block {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            max-width: 82%;
        }

        .mini-orb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            flex-shrink: 0;
            margin-top: 6px;
            background: radial-gradient(circle at 35% 30%, #ffffff, #c084fc 45%, #5b21b6 90%);
            box-shadow: 0 0 14px rgba(168, 85, 247, 0.55);
        }

        .bubble-assistant {
            background: rgba(22, 19, 43, 0.88);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 13px 17px;
            border-radius: 6px 16px 16px 16px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* Bottom composer */
        .composer-wrapper {
            position: fixed;
            left: 268px;
            right: 0;
            bottom: 0;
            padding: 16px 24px 22px;
            background: linear-gradient(to top, rgba(9, 8, 18, 0.96) 65%, rgba(9, 8, 18, 0));
            display: flex;
            justify-content: center;
            transition: left 0.25s ease;
            z-index: 20;
        }

        .sidebar.collapsed ~ .main-area .composer-wrapper {
            left: 0;
        }

        .composer-box {
            width: 100%;
            max-width: 780px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(21, 18, 41, 0.94);
            border: 1px solid var(--border-subtle);
            border-radius: 999px;
            padding: 8px 10px 8px 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(14px);
        }

        .composer-box:focus-within {
            border-color: var(--border-strong);
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.14), 0 12px 35px rgba(0, 0, 0, 0.55);
        }

        .mic-hint {
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        #prompt-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            resize: none;
            max-height: 120px;
            line-height: 1.45;
            padding: 6px 0;
        }

        #prompt-input::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--accent-2), var(--accent));
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.15s ease, opacity 0.15s ease, box-shadow 0.2s ease;
            box-shadow: 0 0 16px var(--accent-glow);
        }

        .send-btn:hover:not(:disabled) {
            transform: scale(1.05);
        }

        .send-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        /* Mobile responsive */
        .mobile-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 25;
        }

        @media (max-width: 820px) {
            .desktop-toggle {
                display: none;
            }

            .topbar-toggle {
                display: flex;
            }

            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                transform: translateX(0);
            }

            .sidebar.mobile-hidden {
                transform: translateX(-100%);
            }

            .mobile-backdrop.show {
                display: block;
            }

            .composer-wrapper {
                left: 0 !important;
                padding: 12px 14px 18px;
            }

            .chat-scroll {
                padding: 62px 14px 130px;
            }

            .bubble-user, .assistant-block {
                max-width: 92%;
            }
        }
    </style>
</head>
<body>
    <div class="mobile-backdrop" id="mobile-backdrop" onclick="fecharSidebarMobile()"></div>

    <div class="app-shell">
        <aside class="sidebar mobile-hidden" id="sidebar">
            <div class="sidebar-top">
                <div class="brand-box">
                    <div class="dots-indicator">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <div class="brand-title">GIDEON.IA</div>
                    <div class="brand-subtitle">PAINEL</div>
                </div>

                <div>
                    <div class="section-label">COMANDOS RÁPIDOS</div>
                    <div class="quick-actions">
                        <button class="cmd-btn" onclick="enviarComandoRapido('Faça um diagnóstico rápido do sistema e da sua prontidão atual.')">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
                            </svg>
                            <span>Diagnóstico</span>
                        </button>

                        <button class="cmd-btn" onclick="resetarSessao()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                                <path d="M3 3v5h5" />
                            </svg>
                            <span>Resetar</span>
                        </button>

                        <button class="cmd-btn" onclick="enviarComandoRapido('Resuma o contexto atual da nossa conversa em pontos objetivos.')">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 3l1.9 4.1L18 9l-4.1 1.9L12 15l-1.9-4.1L6 9l4.1-1.9L12 3z" />
                            </svg>
                            <span>Resumo</span>
                        </button>

                        <button class="cmd-btn" onclick="enviarComandoRapido('Traduza ou explique de forma clara a última resposta relevante.')">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M5 8l6 6" />
                                <path d="M4 14l6-6 2-3" />
                                <path d="M2 5h12" />
                                <path d="M7 2h1" />
                                <path d="M22 22l-5-10-5 10" />
                                <path d="M14 18h6" />
                            </svg>
                            <span>Traduzir</span>
                        </button>
                    </div>
                </div>

                <div>
                    <div class="section-label">STATUS</div>
                    <div class="status-card">
                        <div class="status-line">
                            <span class="status-dot"></span>
                            <span>Online</span>
                        </div>
                        <div class="status-meta" id="latency-label">Latência: --</div>
                        <div class="status-meta" id="model-label">Modelo: {{ model_name or 'Gideon Core' }}</div>
                    </div>
                </div>

                <div>
                    <div class="section-label">CONTROLES</div>
                    <div class="controls-list">
                        <label class="control-row">
                            <span>Modo Silencioso</span>
                            <span class="switch">
                                <input type="checkbox" id="silent-mode-toggle" />
                                <span class="slider"></span>
                            </span>
                        </label>

                        <label class="control-row">
                            <span>Notificações</span>
                            <span class="switch">
                                <input type="checkbox" id="notifications-toggle" checked />
                                <span class="slider"></span>
                            </span>
                        </label>
                    </div>
                </div>
            </div>
        </aside>

        <main class="main-area">
            <button class="topbar-toggle" onclick="toggleSidebar()" aria-label="Alternar menu">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="6" x2="21" y2="6" />
                    <line x1="3" y1="12" x2="21" y2="12" />
                    <line x1="3" y1="18" x2="21" y2="18" />
                </svg>
            </button>

            <button class="desktop-toggle" onclick="toggleSidebar()" title="Alternar barra lateral" aria-label="Alternar barra lateral">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" />
                    <line x1="9" y1="3" x2="9" y2="21" />
                </svg>
            </button>

            <div class="chat-scroll" id="chat-scroll">
                <div class="chat-container" id="chat-container">
                    <div class="core-header">
                        <div class="gideon-orb" id="gideon-orb"></div>
                        <div class="core-status-text" id="core-status-text">
                            <span>GIDEON.IA</span>
                            <span>•</span>
                            <span class="online-word" id="state-label">Online</span>
                            <span>•</span>
                            <span>Modelo: {{ model_name or 'Gideon Core' }}</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="composer-wrapper">
                <form class="composer-box" id="composer-form" onsubmit="enviarMensagem(event)">
                    <span class="mic-hint" title="Entrada por texto">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z" />
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                            <line x1="12" y1="19" x2="12" y2="22" />
                        </svg>
                    </span>

                    <textarea
                        id="prompt-input"
                        rows="1"
                        placeholder="Envie um comando para o Gideon..."
                        onkeydown="tratarTecla(event)"
                        oninput="autoResizeTextarea(this)"
                    ></textarea>

                    <button type="submit" class="send-btn" id="send-btn" aria-label="Enviar comando">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                            <path d="M12 19V5" />
                            <path d="M5 12l7-7 7 7" />
                        </svg>
                    </button>
                </form>
            </div>
        </main>
    </div>

    <audio id="gideon-player" preload="none" style="display: none;"></audio>

    <script>
        const sessionId = "web-" + (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2));
        const chatContainer = document.getElementById("chat-container");
        const chatScroll = document.getElementById("chat-scroll");
        const promptInput = document.getElementById("prompt-input");
        const sendBtn = document.getElementById("send-btn");
        const gideonOrb = document.getElementById("gideon-orb");
        const stateLabel = document.getElementById("state-label");
        const latencyLabel = document.getElementById("latency-label");
        const sidebar = document.getElementById("sidebar");
        const mobileBackdrop = document.getElementById("mobile-backdrop");
        const gideonPlayer = document.getElementById("gideon-player");

        let isStreaming = false;

        function toggleSidebar() {
            if (window.innerWidth <= 820) {
                sidebar.classList.toggle("mobile-hidden");
                mobileBackdrop.classList.toggle("show", !sidebar.classList.contains("mobile-hidden"));
            } else {
                sidebar.classList.toggle("collapsed");
            }
        }

        function fecharSidebarMobile() {
            sidebar.classList.add("mobile-hidden");
            mobileBackdrop.classList.remove("show");
        }

        function autoResizeTextarea(el) {
            el.style.height = "auto";
            el.style.height = Math.min(el.scrollHeight, 120) + "px";
        }

        function tratarTecla(e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                enviarMensagem(e);
            }
        }

        function setEstado(estado) {
            if (estado === "pensando") {
                gideonOrb.classList.add("thinking");
                stateLabel.textContent = "Processando";
                stateLabel.style.color = "#c084fc";
            } else {
                gideonOrb.classList.remove("thinking");
                stateLabel.textContent = "Online";
                stateLabel.style.color = "#34d399";
            }
        }

        function rolarParaBaixo() {
            chatScroll.scrollTop = chatScroll.scrollHeight;
        }

        function adicionarMensagemUsuario(texto) {
            const row = document.createElement("div");
            row.className = "msg-row user";

            const bubble = document.createElement("div");
            bubble.className = "bubble-user";
            bubble.textContent = texto;

            row.appendChild(bubble);
            chatContainer.appendChild(row);
            rolarParaBaixo();
        }

        function criarBolhaAssistente() {
            const row = document.createElement("div");
            row.className = "msg-row assistant";

            const block = document.createElement("div");
            block.className = "assistant-block";

            const orb = document.createElement("div");
            orb.className = "mini-orb";

            const bubble = document.createElement("div");
            bubble.className = "bubble-assistant";
            bubble.textContent = "";

            block.appendChild(orb);
            block.appendChild(bubble);
            row.appendChild(block);
            chatContainer.appendChild(row);
            rolarParaBaixo();

            return bubble;
        }

        async function tocarAudioDireto(url) {
            if (!gideonPlayer || !url) return false;

            try {
                const urlObj = new URL(url, window.location.href);
                if (urlObj.protocol !== "http:" && urlObj.protocol !== "https:") {
                    return false;
                }

                gideonPlayer.pause();
                gideonPlayer.src = urlObj.href;
                gideonPlayer.load();
                await gideonPlayer.play();
                return true;
            } catch (err) {
                console.warn("Autoplay ou reprodução direta bloqueada/falhou:", err);
                return false;
            }
        }

        function executarComandoGideon(comando) {
            if (!comando || typeof comando !== "object" || !comando.acao) return;

            const acao = String(comando.acao).toLowerCase();
            const query = comando.query || "";
            const alvo = String(comando.alvo || "").toLowerCase();
            const urlDireta = comando.url || comando.audio_url || "";

            if (acao === "tocar_musica") {
                if (urlDireta) {
                    tocarAudioDireto(urlDireta).then((tocou) => {
                        if (!tocou && query) {
                            const q = encodeURIComponent(query);
                            const fallbackUrl = alvo === "spotify"
                                ? `https://open.spotify.com/search/${q}`
                                : alvo === "youtube"
                                    ? `https://www.youtube.com/results?search_query=${q}`
                                    : `https://music.youtube.com/search?q=${q}`;
                            window.open(fallbackUrl, "_blank", "noopener,noreferrer");
                        }
                    });
                    return;
                }

                const q = encodeURIComponent(query);
                let url = `https://music.youtube.com/search?q=${q}`;
                if (alvo === "spotify") {
                    url = `https://open.spotify.com/search/${q}`;
                } else if (alvo === "youtube") {
                    url = `https://www.youtube.com/results?search_query=${q}`;
                }
                window.open(url, "_blank", "noopener,noreferrer");
            } else if (acao === "abrir_url" && query) {
                try {
                    const urlObj = new URL(query);
                    if (urlObj.protocol === "http:" || urlObj.protocol === "https:") {
                        window.open(urlObj.href, "_blank", "noopener,noreferrer");
                    }
                } catch (_) {}
            } else if (acao === "buscar_web" && query) {
                const url = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
                window.open(url, "_blank", "noopener,noreferrer");
            }
        }

        function extrairEExecutarCmd(texto) {
            if (!texto) return "";
            const regex = /\[\[CMD:\s*(\{[\s\S]*?\})\s*\]\]/g;
            let match;
            while ((match = regex.exec(texto)) !== null) {
                try {
                    const parsed = JSON.parse(match[1]);
                    executarComandoGideon(parsed);
                } catch (err) {
                    console.warn("Falha ao interpretar [[CMD]]:", err);
                }
            }
            return texto.replace(regex, "").trim();
        }

        async function enviarMensagem(event) {
            if (event) event.preventDefault();
            if (isStreaming) return;

            const texto = promptInput.value.trim();
            if (!texto) return;

            isStreaming = true;
            sendBtn.disabled = true;
            promptInput.value = "";
            promptInput.style.height = "auto";

            adicionarMensagemUsuario(texto);
            const bubble = criarBolhaAssistente();
            setEstado("pensando");

            const inicio = performance.now();
            let respostaBruta = "";

            try {
                const resp = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        session_id: sessionId,
                        message: texto,
                        silent_mode: document.getElementById("silent-mode-toggle").checked
                    })
                });

                if (!resp.ok || !resp.body) {
                    throw new Error("Erro na resposta do servidor (" + resp.status + ")");
                }

                const reader = resp.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    respostaBruta += decoder.decode(value, { stream: true });

                    const textoVisivelParcial = respostaBruta
                        .replace(/\[\[CMD:[\s\S]*?(\]\]|$)/g, "")
                        .trim();
                    bubble.textContent = textoVisivelParcial || "...";
                    rolarParaBaixo();
                }

                const textoFinalLimpo = extrairEExecutarCmd(respostaBruta);
                bubble.textContent = textoFinalLimpo || "Comando executado.";

                const duracaoMs = Math.round(performance.now() - inicio);
                latencyLabel.textContent = `Latência: ${duracaoMs}ms`;
            } catch (err) {
                bubble.textContent = "Falha de comunicação com o Gideon: " + err.message;
                latencyLabel.textContent = "Latência: erro";
            } finally {
                isStreaming = false;
                sendBtn.disabled = false;
                setEstado("online");
                rolarParaBaixo();
                promptInput.focus();
            }
        }

        function enviarComandoRapido(texto) {
            if (isStreaming) return;
            promptInput.value = texto;
            if (window.innerWidth <= 820) {
                fecharSidebarMobile();
            }
            enviarMensagem();
        }

        async function resetarSessao() {
            try {
                await fetch("/api/reset", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ session_id: sessionId })
                });
            } catch (_) {}

            if (gideonPlayer) {
                gideonPlayer.pause();
                gideonPlayer.removeAttribute("src");
                gideonPlayer.load();
            }

            const mensagens = chatContainer.querySelectorAll(".msg-row");
            mensagens.forEach((m) => m.remove());
            latencyLabel.textContent = "Latência: --";
            if (window.innerWidth <= 820) {
                fecharSidebarMobile();
            }
        }
    </script>
</body>
