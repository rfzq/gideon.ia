<script>
        const orb = document.getElementById('orb');
        const statusLabel = document.getElementById('status-label');
        const responseBox = document.getElementById('ai-response');
        const userInput = document.getElementById('user-input');
        const latencyDisplay = document.getElementById('latency-display');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        function toggleSidebar() {
            sidebar?.classList.toggle('open');
            overlay?.classList.toggle('active');
        }

        function fecharSidebarMobile() {
            if (window.innerWidth <= 768) {
                sidebar?.classList.remove('open');
                overlay?.classList.remove('active');
            }
        }

        function setEstado(pensando) {
            if (pensando) {
                orb?.classList.add('thinking');
                if (statusLabel) {
                    statusLabel.innerHTML = 'GIDEON.IA <span>// PROCESSANDO...</span>';
                }
            } else {
                orb?.classList.remove('thinking');
                if (statusLabel) {
                    statusLabel.innerHTML = 'GIDEON.IA <span>// PRONTO</span>';
                }
            }
        }

        async function processarEnvio(mensagem) {
            if (!mensagem.trim()) return;

            fecharSidebarMobile();
            setEstado(true);

            if (responseBox) {
                responseBox.innerHTML = `
                    <div style="color: #9499b0; font-size: 12px; margin-bottom: 6px;">Você: ${mensagem}</div>
                    <div id="gideon-stream-text"></div>
                `;
            }
            const streamTarget = document.getElementById('gideon-stream-text');

            const inicio = performance.now();
            let primeiroChunk = true;

            try {
                const resposta = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mensagem })
                });

                if (!resposta.ok) {
                    if (streamTarget) {
                        streamTarget.textContent = `Erro HTTP ${resposta.status} ao falar com o servidor.`;
                    }
                    return;
                }

                const contentType = resposta.headers.get('content-type') || '';
                if (contentType.includes('application/json')) {
                    const dados = await resposta.json();
                    if (latencyDisplay) {
                        latencyDisplay.textContent = `Latência: ${Math.round(performance.now() - inicio)}ms`;
                    }
                    if (streamTarget) {
                        streamTarget.textContent = dados.erro || dados.resposta || dados.response || "Resposta recebida.";
                    }
                    return;
                }

                const reader = resposta.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    if (primeiroChunk) {
                        if (latencyDisplay) {
                            latencyDisplay.textContent = `Latência: ${Math.round(performance.now() - inicio)}ms`;
                        }
                        primeiroChunk = false;
                    }

                    if (streamTarget) {
                        streamTarget.textContent += decoder.decode(value, { stream: true });
                    }
                    if (responseBox) {
                        responseBox.scrollTop = responseBox.scrollHeight;
                    }
                }

                if (streamTarget && !streamTarget.textContent.trim()) {
                    streamTarget.textContent = "Sem conteúdo retornado pelo modelo.";
                }
            } catch (erro) {
                console.error(erro);
                if (streamTarget) {
                    streamTarget.textContent = "Não foi possível conectar ao backend.";
                }
            } finally {
                setEstado(false);
            }
        }

        function enviarMensagem(e) {
            e.preventDefault();
            if (!userInput) return;
            const texto = userInput.value;
            userInput.value = '';
            processarEnvio(texto);
        }

        function enviarComandoRapido(comando) {
            processarEnvio(comando);
        }

        function resetarSessao() {
            fecharSidebarMobile();
            if (responseBox) {
                responseBox.textContent = "Tela limpa. Pronto para um novo comando.";
            }
            if (statusLabel) {
                statusLabel.innerHTML = 'GIDEON.IA <span>// PRONTO</span>';
            }
        }
    </script>
</body>
</html>
