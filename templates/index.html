<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>gideon.ia</title>
  <style>
    :root {
      --bg-main: #09090b;
      --bg-card: #121216;
      --border-color: #27272a;
      --accent-color: #9d7ff5;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      padding: 16px 24px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-weight: 800;
      font-size: 1.2rem;
      color: var(--accent-color);
      letter-spacing: -0.5px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg {
      max-width: 80%;
      padding: 14px 18px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      font-size: 0.95rem;
    }

    .user {
      align-self: flex-end;
      background: var(--accent-color);
      color: #000;
      font-weight: 500;
      border-bottom-right-radius: 2px;
    }

    .bot {
      align-self: flex-start;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-bottom-left-radius: 2px;
    }

    form {
      display: flex;
      gap: 12px;
      padding: 16px;
      background: var(--bg-card);
      border-top: 1px solid var(--border-color);
    }

    input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 9999px;
      border: 1px solid var(--border-color);
      background: var(--bg-main);
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--accent-color);
    }

    button {
      padding: 12px 24px;
      border: none;
      border-radius: 9999px;
      background: var(--accent-color);
      color: #000;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">gideon.ia</div>
    <div class="status">
      <div class="status-dot"></div>
      online
    </div>
  </header>
  <div id="chat"></div>
  <form id="form">
    <input id="input" type="text" placeholder="Pergunta algo ao Gideon..." autocomplete="off" required />
    <button type="submit">Enviar</button>
  </form>

  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('input');

    function addMsg(text, cls) {
      const div = document.createElement('div');
      div.className = 'msg ' + cls;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addMsg(text, 'user');
      input.value = '';

      const botDiv = addMsg('...', 'bot');

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mensagem: text })
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        botDiv.textContent = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          botDiv.textContent += decoder.decode(value, { stream: true });
          chat.scrollTop = chat.scrollHeight;
        }
      } catch (err) {
        botDiv.textContent = 'Erro ao contactar o servidor.';
      }
    });
  </script>
</body>
</html>
