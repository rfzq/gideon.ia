<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gideon IA</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #0f1117; color: #e6edf3; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 14px 20px; background: #161b22; border-bottom: 1px solid #30363d; font-weight: 600; }
    #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 75%; padding: 10px 14px; border-radius: 10px; line-height: 1.4; white-space: pre-wrap; }
    .user { align-self: flex-end; background: #1f6feb; color: #fff; }
    .bot { align-self: flex-start; background: #21262d; border: 1px solid #30363d; }
    form { display: flex; gap: 10px; padding: 14px; background: #161b22; border-top: 1px solid #30363d; }
    input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #fff; outline: none; }
    button { padding: 10px 18px; border: none; border-radius: 8px; background: #238636; color: #fff; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <header>Gideon IA</header>
  <div id="chat"></div>
  <form id="form">
    <input id="input" type="text" placeholder="Escreve uma mensagem para a Gideon..." autocomplete="off" required />
    <button type="submit">Enviar</button>
  </form>

  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('input');

    function addMsg(text, cls) {
      const div = document.createElement('div');
      div.className = 'msg ' + cls;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addMsg(text, 'user');
      input.value = '';

      const botDiv = addMsg('...', 'bot');

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mensagem: text })
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        botDiv.textContent = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          botDiv.textContent += decoder.decode(value, { stream: true });
          chat.scrollTop = chat.scrollHeight;
        }
      } catch (err) {
        botDiv.textContent = 'Erro ao contactar o servidor.';
      }
    });
  </script>
</body>
</html>
