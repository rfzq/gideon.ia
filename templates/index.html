<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gideon // Painel</title>
    <style>
        :root {
            --bg-dark: #07070b;
            --glass-bg: rgba(20, 21, 32, 0.90);
            --glass-card: rgba(28, 25, 48, 0.72);
            --glass-user: rgba(45, 38, 82, 0.78);
            --glass-border: rgba(155, 135, 255, 0.22);
            --accent-purple: #8b75ff;
            --text-main: #ffffff;
            --text-muted: #9ca2bc;
            --status-green: #38e57d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image:
                radial-gradient(circle at 50% 20%, rgba(92, 71, 204, 0.20) 0%, transparent 55%),
                radial-gradient(circle at 80% 80%, rgba(65, 45, 140, 0.14) 0%, transparent 50%);
            color: var(--text-main);
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Tela inicial limpa */
        .splash-screen {
            position: fixed;
            inset: 0;
            background-color: var(--bg-dark);
            background-image:
                radial-gradient(circle at 50% 45%, rgba(92, 71, 204, 0.24) 0%, transparent 55%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }

        .splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .start-btn {
            background: rgba(28, 25, 48, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(155, 135, 255, 0.45);
            color: var(--text-main);
            padding: 14px 28px;
            border-radius: 999px;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.4px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
        }

        .start-btn:hover {
            background: rgba(139, 117, 255, 0.22);
            border-color: var(--accent-purple);
            transform: translateY(-1px);
        }

        .start-btn:active {
            transform: scale(0.98);
        }

        /* Cabeçalho Mobile */
        .mobile-header {
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px 0;
            z-index: 20;
            flex-shrink: 0;
        }

        .menu-toggle-btn {
            background: rgba(25, 27, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 7px 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .header-badge {
            font-size: 11px;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            z-index: 90;
        }
        .sidebar-overlay.active {
            display: block;
        }

        /* Layout Principal */
        .app-container {
            display: flex;
            flex: 1;
            padding: 12px 16px 6px;
            gap: 20px;
            min-height: 0;
            position: relative;
        }

        /* Gaveta / Painel Lateral */
        .sidebar {
            width: 260px;
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            flex-shrink: 0;
        }

        .brand {
            text-align: center;
            padding-bottom: 6px;
            position: relative;
        }
        .close-sidebar-btn {
            display: none;
            position: absolute;
            right: 0;
            top: -4px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 22px;
            cursor: pointer;
        }
        .brand h1 {
            font-size: 13px;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .brand span {
            font-size: 11px;
            letter-spacing: 1px;
            color: var(--text-muted);
            display: block;
            margin-top: 2px;
        }

        .section-title {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-main);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .quick-commands {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .cmd-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid transparent;
            color: var(--text-main);
            padding: 9px 12px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }
        .cmd-btn:hover {
            background: rgba(139, 117, 255, 0.18);
            border-color: rgba(139, 117, 255, 0.35);
        }

        .status-box {
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            color: var(--text-muted);
            word-break: break-word;
        }
        .status-online {
            color: var(--status-green);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-dot {
            width: 7px;
            height: 7px;
            background-color: var(--status-green);
            border-radius: 50%;
        }

        .controls-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: auto;
        }
        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 12px;
            border-radius: 16px;
            font-size: 12px;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 34px;
            height: 18px;
            flex-shrink: 0;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.15);
            transition: .3s;
            border-radius: 20px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: var(--accent-purple);
        }
        input:checked + .slider:before {
            transform: translateX(16px);
        }

        /* Área Principal de Conversa */
        .main-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 720px;
            margin: 0 auto;
            width: 100%;
            min-height: 0;
        }

        .top-status-bar {
            width: 100%;
            padding: 8px 4px 12px;
            display: flex;
            justify-content: center;
            flex-shrink: 0;
        }

        .status-pill {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            background: rgba(24, 24, 38, 0.65);
            border: 1px solid var(--glass-border);
            padding: 6px 14px;
            border-radius: 999px;
        }

        .status-pill strong {
            color: var(--text-main);
            font-weight: 600;
        }

        .status-pill .online-txt {
            color: var(--status-green);
            font-weight: 600;
        }

        /* Feed de Mensagens */
        .chat-feed {
            flex: 1;
            width: 100%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 4px 4px 14px;
            scroll-behavior: smooth;
        }

        .msg-row {
            display: flex;
            width: 100%;
        }
        .msg-row.user {
            justify-content: flex-end;
        }
        .msg-row.assistant {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 84%;
            border-radius: 18px;
            padding: 14px 18px;
            font-size: 15px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
        }

        .bubble.user-bubble {
            background: var(--glass-user);
            border: 1px solid rgba(155, 135, 255, 0.35);
            color: var(--text-main);
            border-bottom-right-radius: 6px;
        }

        .bubble.assistant-bubble {
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            color: #eef0fa;
            border-bottom-left-radius: 6px;
        }

        /* Barra Inferior de Input */
        .input-bar-container {
            padding: 6px 16px 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .input-form {
            width: 100%;
            max-width: 720px;
            background: rgba(24, 24, 38, 0.78);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 6px 8px 6px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .input-form input {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 15px;
        }
        .input-form input::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #9b87ff, #6b5ce7);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        @media (max-width: 768px) {
            .mobile-header {
                display: flex;
            }
            .app-container {
                padding: 8px 12px 4px;
            }
            .sidebar {
                position: fixed;
                top: 12px;
                bottom: 12px;
                left: 12px;
                width: 270px;
                transform: translateX(-115%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .close-sidebar-btn {
                display: block;
            }
            .bubble {
                max-width: 90%;
                font-size: 14px;
                padding: 12px 15px;
            }
        }
    </style>
</head>
<body>

    <div class="splash-screen" id="splash-screen">
        <button type="button" class="start-btn" onclick="iniciarGideon()">Iniciar Gideon</button>
    </div>

    <header class="mobile-header">
        <button type="button" class="menu-toggle-btn" onclick="toggleSidebar()">Painel</button>
        <span class="header-badge">Gideon</span>
    </header>

    <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <button type="button" class="close-sidebar-btn" onclick="toggleSidebar()">×</button>
                <h1>Gideon</h1>
                <span>Painel</span>
            </div>

            <div>
                <div class="section-title">Comandos rápidos</div>
                <div class="quick-commands">
                    <button type="button" class="cmd-btn" onclick="enviarComandoRapido('Executar diagnóstico completo do sistema')">Diagnóstico</button>
                    <button type="button" class="cmd-btn" onclick="resetarSessao()">Resetar</button>
                    <button type="button" class="cmd-btn" onclick="enviarComandoRapido('Faz um resumo da nossa conversa')">Resumo</button>
                    <button type="button" class="cmd-btn" onclick="enviarComandoRapido('Traduz a última resposta para Inglês')">Traduzir</button>
                </div>
            </div>

            <div>
                <div class="section-title">Status</div>
                <div class="status-box">
                    <div class="status-online"><span class="status-dot"></span> Online</div>
                    <div id="latency-sidebar">Latência: --</div>
                    <div>Modelo: {{ modelo | default("openai/gpt-4o-mini") }}</div>
                </div>
            </div>

            <div class="controls-list">
                <div class="section-title" style="margin-bottom: 2px;">Controles</div>
                <div class="control-row">
                    <span>Modo silencioso</span>
                    <label class="switch">
                        <input type="checkbox" id="silent-mode" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="control-row">
                    <span>Notificações</span>
                    <label class="switch">
                        <input type="checkbox" id="notifications-mode">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </aside>

        <main class="main-stage">
            <div class="top-status-bar">
                <div class="status-pill">
                    <strong>Gideon</strong>
                    <span>•</span>
                    <span class="online-txt" id="state-label">Online</span>
                    <span>•</span>
                    <span>Modelo: {{ modelo | default("openai/gpt-4o-mini") }}</span>
                </div>
            </div>

            <div class="chat-feed" id="chat-feed">
                <div class="msg-row assistant">
                    <div class="bubble assistant-bubble">Oi! O que você precisa?</div>
                </div>
            </div>
        </main>
    </div>

    <div class="input-bar-container">
        <form class="input-form" id="chat-form" onsubmit="enviarMensagem(event)">
            <input type="text" id="user-input" placeholder="Envie um comando para o Gideon..." autocomplete="off" required>
            <button type="submit" class="send-btn" title="Enviar">➤</button>
        </form>
    </div>

    <script>
        const splashScreen = document.getElementById('splash-screen');
        const stateLabel = document.getElementById('state-label');
        const chatFeed = document.getElementById('chat-feed');
        const userInput = document.getElementById('user-input');
        const latencySidebar = document.getElementById('latency-sidebar');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        function iniciarGideon() {
            splashScreen.classList.add('hidden');
            setTimeout(() => userInput.focus(), 200);
        }

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        function fecharSidebarMobile() {
            if (window.innerWidth <= 768) {
                sidebar.classList.remove('open');
                overlay.classList.remove('active');
            }
        }

        function setEstado(pensando) {
            stateLabel.textContent = pensando ? 'Processando...' : 'Online';
        }

        function rolarParaBaixo() {
            chatFeed.scrollTop = chatFeed.scrollHeight;
        }

        function adicionarMensagemUsuario(texto) {
            const row = document.createElement('div');
            row.className = 'msg-row user';

            const bubble = document.createElement('div');
            bubble.className = 'bubble user-bubble';
            bubble.textContent = texto;

            row.appendChild(bubble);
            chatFeed.appendChild(row);
            rolarParaBaixo();
        }

        function criarBolhaAssistente() {
            const row = document.createElement('div');
            row.className = 'msg-row assistant';

            const bubble = document.createElement('div');
            bubble.className = 'bubble assistant-bubble';
            bubble.textContent = '...';

            row.appendChild(bubble);
            chatFeed.appendChild(row);
            rolarParaBaixo();

            return bubble;
        }

        async function processarEnvio(mensagem) {
            if (!mensagem.trim()) return;

            fecharSidebarMobile();
            setEstado(true);
            adicionarMensagemUsuario(mensagem);
            const targetText = criarBolhaAssistente();

            const inicio = performance.now();
            let primeiroChunk = true;
            let limpouPlaceholder = false;

            try {
                const resposta = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mensagem })
                });

                if (!resposta.ok) {
                    targetText.textContent = `Erro HTTP ${resposta.status} ao falar com o servidor.`;
                    return;
                }

                const contentType = resposta.headers.get('content-type') || '';
                if (contentType.includes('application/json')) {
                    const dados = await resposta.json();
                    latencySidebar.textContent = `Latência: ${Math.round(performance.now() - inicio)}ms`;
                    targetText.textContent = dados.erro || dados.resposta || dados.response || "Resposta recebida.";
                    rolarParaBaixo();
                    return;
                }

                const reader = resposta.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    if (primeiroChunk) {
                        latencySidebar.textContent = `Latência: ${Math.round(performance.now() - inicio)}ms`;
                        primeiroChunk = false;
                    }

                    if (!limpouPlaceholder) {
                        targetText.textContent = "";
                        limpouPlaceholder = true;
                    }

                    targetText.textContent += decoder.decode(value, { stream: true });
                    rolarParaBaixo();
                }

                if (!targetText.textContent.trim()) {
                    targetText.textContent = "Sem conteúdo retornado pelo modelo.";
                }
            } catch (erro) {
                console.error(erro);
                targetText.textContent = "Não foi possível conectar ao backend.";
            } finally {
                setEstado(false);
                rolarParaBaixo();
            }
        }

        function enviarMensagem(e) {
            e.preventDefault();
            const texto = userInput.value;
            userInput.value = '';
            processarEnvio(texto);
        }

        function enviarComandoRapido(comando) {
            processarEnvio(comando);
        }

        function resetarSessao() {
            fecharSidebarMobile();
            chatFeed.innerHTML = '';
            const targetText = criarBolhaAssistente();
            targetText.textContent = "Conversa limpa. O que você precisa?";
            setEstado(false);
        }
    </script>
</body>
</html>
